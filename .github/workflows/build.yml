name: Build Pi-Star OS Image

on:
  schedule:
    # Quarterly: 1st of Jan/Apr/Jul/Oct at 2 AM UTC
    - cron: '0 2 1 */3 *'
  workflow_dispatch:
    inputs:
      force_build:
        type: boolean
        description: 'Force build even if no upstream changes'
        required: false
        default: false

env:
  ALPINE_VERSION: "3.23"
  ALPINE_ARCH: "armhf"
  IMAGE_SIZE: "3500M"
  BOOT_SIZE: "257MiB"
  SLOT_A_END: "1793MiB"
  SLOT_B_END: "3329MiB"

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      build_date: ${{ steps.set-date.outputs.date }}
      version: ${{ steps.set-date.outputs.version }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set build date and version
      id: set-date
      run: |
        BUILD_DATE=$(date +'%Y-%m-%d')
        VERSION="5.0.0"
        echo "date=$BUILD_DATE" >> "$GITHUB_OUTPUT"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "BUILD_DATE=$BUILD_DATE" >> "$GITHUB_ENV"
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"

    - name: Check for upstream changes
      if: github.event_name == 'schedule'
      id: check-upstream
      run: |
        # Check if RasPINE has new releases since our last build
        LATEST_RASPINE=$(curl -s https://api.github.com/repos/MW0MWZ/RasPINE/releases/latest | jq -r '.tag_name // empty')
        LAST_BUILD=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest | jq -r '.tag_name // empty')

        if [ -z "$LATEST_RASPINE" ]; then
          echo "Could not check upstream - building anyway"
          echo "should_build=true" >> "$GITHUB_OUTPUT"
        elif [ "$LATEST_RASPINE" = "$LAST_BUILD" ] && [ "${{ inputs.force_build }}" != "true" ]; then
          echo "No upstream changes detected"
          echo "should_build=false" >> "$GITHUB_OUTPUT"
        else
          echo "Upstream changes detected or force build requested"
          echo "should_build=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Skip build if no changes
      if: steps.check-upstream.outputs.should_build == 'false'
      run: |
        echo "No upstream changes - skipping build"
        exit 0

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          qemu-user-static \
          binfmt-support \
          parted \
          kpartx \
          dosfstools \
          e2fsprogs \
          wget \
          curl \
          xz-utils \
          fdisk \
          util-linux \
          rsync \
          git \
          jq \
          coreutils

    - name: Set up QEMU for ARM emulation
      run: |
        sudo update-binfmts --display
        sudo update-binfmts --enable qemu-arm
        sudo update-binfmts --enable qemu-aarch64

    - name: Create 4-partition image
      run: |
        echo "Creating ${IMAGE_SIZE} image with A/B partition layout..."
        truncate -s "${IMAGE_SIZE}" pistar-os.img

        # Create 4-partition layout:
        #   P1: boot (FAT32)  1MiB - 257MiB    = 256 MiB
        #   P2: slot A (ext4) 257MiB - 1793MiB  = 1536 MiB
        #   P3: slot B (ext4) 1793MiB - 3329MiB = 1536 MiB
        #   P4: data (ext4)   3329MiB - 100%     = ~171 MiB (expands on first boot)
        parted -s pistar-os.img \
          mklabel msdos \
          mkpart primary fat32 1MiB "${BOOT_SIZE}" \
          mkpart primary ext4 "${BOOT_SIZE}" "${SLOT_A_END}" \
          mkpart primary ext4 "${SLOT_A_END}" "${SLOT_B_END}" \
          mkpart primary ext4 "${SLOT_B_END}" 100% \
          set 1 boot on

    - name: Set up loop device and format partitions
      run: |
        sudo losetup -P /dev/loop0 pistar-os.img

        echo "Formatting boot partition (P1)..."
        sudo mkfs.vfat -F 32 -n BOOT /dev/loop0p1

        echo "Formatting slot A partition (P2)..."
        sudo mkfs.ext4 -L rootfs-a /dev/loop0p2

        echo "Formatting slot B partition (P3)..."
        sudo mkfs.ext4 -L rootfs-b /dev/loop0p3

        echo "Formatting data partition (P4)..."
        sudo mkfs.ext4 -L data /dev/loop0p4

        # Mount partitions
        sudo mkdir -p /mnt/{boot,root,data}
        sudo mount /dev/loop0p1 /mnt/boot
        sudo mount /dev/loop0p2 /mnt/root
        sudo mount /dev/loop0p4 /mnt/data

    - name: Install Alpine Linux rootfs
      run: |
        ALPINE_MIRROR="https://dl-cdn.alpinelinux.org/alpine/v${ALPINE_VERSION}"

        echo "Searching for Alpine rootfs files..."
        ALPINE_FILE=$(curl -s "${ALPINE_MIRROR}/releases/${ALPINE_ARCH}/" | \
                      grep -o 'alpine-minirootfs[^"<]*\.tar\.gz' | \
                      grep "${ALPINE_VERSION}" | \
                      head -1)

        if [ -z "$ALPINE_FILE" ]; then
          ALPINE_FILE=$(curl -s "${ALPINE_MIRROR}/releases/${ALPINE_ARCH}/" | \
                        sed -n 's/.*href="\(alpine-minirootfs-[^"]*\.tar\.gz\).*/\1/p' | \
                        grep "${ALPINE_VERSION}" | \
                        head -1)
        fi

        if [ -z "$ALPINE_FILE" ]; then
          PATCH_VERSION=$(curl -s "${ALPINE_MIRROR}/releases/${ALPINE_ARCH}/" | \
                          grep -o "alpine-minirootfs-${ALPINE_VERSION}\.[0-9]*-${ALPINE_ARCH}\.tar\.gz" | \
                          sed "s/.*-${ALPINE_VERSION}\.\([0-9]*\)-.*/\1/" | \
                          sort -n | tail -1)
          if [ -n "$PATCH_VERSION" ]; then
            ALPINE_FILE="alpine-minirootfs-${ALPINE_VERSION}.${PATCH_VERSION}-${ALPINE_ARCH}.tar.gz"
          else
            ALPINE_FILE="alpine-minirootfs-${ALPINE_VERSION}.0-${ALPINE_ARCH}.tar.gz"
          fi
        fi

        echo "Found Alpine rootfs: ${ALPINE_FILE}"
        FULL_URL="${ALPINE_MIRROR}/releases/${ALPINE_ARCH}/${ALPINE_FILE}"

        curl -L -f -o "${ALPINE_FILE}" "${FULL_URL}" || {
          echo "Download failed!"
          curl -I "${FULL_URL}"
          exit 1
        }

        echo "Extracting Alpine rootfs to /mnt/root/..."
        sudo tar -xzf "${ALPINE_FILE}" -C /mnt/root/

        sudo cp /usr/bin/qemu-arm-static /mnt/root/usr/bin/

    - name: Configure Alpine base system
      run: |
        sudo cp /etc/resolv.conf /mnt/root/etc/resolv.conf

        sudo tee /mnt/root/etc/alpine-build-env << ENV_EOF
        export ALPINE_VERSION="${ALPINE_VERSION}"
        export ALPINE_ARCH="${ALPINE_ARCH}"
        ENV_EOF

        sudo mount -t proc none /mnt/root/proc
        sudo mount -t sysfs none /mnt/root/sys
        sudo mount -o bind /dev /mnt/root/dev
        sudo mount -o bind /dev/pts /mnt/root/dev/pts || true

        cat << 'EOF' | sudo tee /mnt/root/setup-alpine.sh
        #!/bin/sh
        set -e

        . /etc/alpine-build-env

        echo "nameserver 8.8.8.8" > /etc/resolv.conf
        echo "nameserver 8.8.4.4" >> /etc/resolv.conf

        # Add RasPINE repository key
        wget -O /etc/apk/keys/raspine.rsa.pub https://raspine.pistar.uk/raspine.rsa.pub

        # Add MMDVM (hamradio) repository key
        wget -O /etc/apk/keys/hamradio.rsa.pub https://apk.pistar.uk/hamradio.rsa.pub

        # Set up repositories
        cat > /etc/apk/repositories << REPOS
        https://raspine.pistar.uk/v${ALPINE_VERSION}/community
        https://dl-cdn.alpinelinux.org/alpine/v${ALPINE_VERSION}/main
        https://dl-cdn.alpinelinux.org/alpine/v${ALPINE_VERSION}/community
        https://apk.pistar.uk/v${ALPINE_VERSION}/community
        REPOS

        apk update

        # Install base packages
        apk add --no-cache \
          alpine-base \
          openrc \
          util-linux \
          e2fsprogs \
          e2fsprogs-extra \
          parted \
          dropbear \
          libc6-compat \
          wpa_supplicant \
          wireless-tools \
          iw \
          ca-certificates \
          ca-certificates-bundle \
          openssl \
          sudo \
          tzdata \
          dhcpcd

        # Install Raspberry Pi kernels from RasPINE repo
        # Symlinks for /lib/modules and /lib/firmware are included in the APK packages
        apk add --no-cache --force-overwrite \
          raspios-firmware \
          raspios-kernel-v6 \
          raspios-kernel-v7 \
          raspios-kernel-v8

        # Install MMDVM packages (all services start disabled)
        apk add --no-cache pi-star

        update-ca-certificates

        # Set up essential services
        rc-update add devfs sysinit
        rc-update add dmesg sysinit
        rc-update add hwdrivers sysinit
        rc-update add mdev sysinit
        rc-update add modules boot
        rc-update add sysctl boot
        rc-update add hostname boot
        rc-update add bootmisc boot
        rc-update del hwclock boot 2>/dev/null || true
        rc-update add swclock boot
        rc-update add syslog boot
        rc-update add networking boot
        rc-update add dropbear default
        rc-update add wpa_supplicant boot
        rc-update add dhcpcd boot

        # Configure hostname
        echo "pi-star" > /etc/hostname
        cat > /etc/hosts << HOSTS
        127.0.0.1   localhost localhost.localdomain
        127.0.1.1   pi-star
        HOSTS

        # Create pi-star user with sudo access
        adduser -D -s /bin/sh pi-star
        addgroup pi-star wheel
        echo "pi-star:raspberry" | chpasswd
        echo "%wheel ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/wheel
        passwd -l root

        # Configure SSH
        mkdir -p /etc/conf.d
        echo 'DROPBEAR_OPTS="-B -s"' > /etc/conf.d/dropbear
        echo 'wpa_supplicant_args="-q"' > /etc/conf.d/wpa_supplicant

        # Fix mdev permissions
        sed -i '/# fallback for any!device/i\# Allow Dialout to use /dev/ttyAMA[0-9]\nttyAMA[0-9]*        root:dialout 0660\n\n# For I2C devices\ni2c-[0-9]*          root:dialout 0660\n\n# For SPI devices\nspidev[0-9].[0-9]   root:dialout 0660\n' /etc/mdev.conf

        # Create necessary directories
        mkdir -p /boot/firmware
        mkdir -p /var/log
        mkdir -p /usr/local/bin
        mkdir -p /home/pi-star
        chown pi-star:pi-star /home/pi-star

        # WiFi modules
        cat >> /etc/modules << MODULES
        brcmfmac
        brcmutil
        cfg80211
        rfkill
        i2c-dev
        spidev
        MODULES

        mkdir -p /etc/modprobe.d
        cat > /etc/modprobe.d/raspi-wifi.conf << MODCONF
        options brcmfmac roamoff=1
        options brcmfmac feature_disable=0x82000
        MODCONF

        cat > /etc/modprobe.d/cfg80211.conf << REGCONF
        options cfg80211 ieee80211_regdom=GB
        REGCONF

        cat > /etc/modprobe.d/rfkill_default.conf << RFKILLCONF
        options rfkill default_state=1 master_switch_mode=2
        RFKILLCONF

        rm -f /boot/initramfs 2>/dev/null || true

        echo "Alpine base system configured for Pi-Star OS"
        EOF

        sudo chmod +x /mnt/root/setup-alpine.sh
        sudo chroot /mnt/root /setup-alpine.sh

        sudo rm /mnt/root/setup-alpine.sh
        sudo rm /mnt/root/etc/alpine-build-env

        sudo umount /mnt/root/dev/pts 2>/dev/null || true
        sudo umount /mnt/root/dev
        sudo umount /mnt/root/sys
        sudo umount /mnt/root/proc

    - name: Configure networking
      run: |
        sudo tee /mnt/root/etc/dhcpcd.conf << 'EOF'
        # Pi-Star OS dhcpcd configuration
        hostname
        clientid
        persistent
        option rapid_commit
        option domain_name_servers, domain_name, domain_search, host_name
        option classless_static_routes
        option interface_mtu
        require dhcp_server_identifier
        slaac hwaddr
        nocarrier
        waitip 4
        nohook wpa_supplicant
        EOF

        sudo mkdir -p /mnt/root/usr/lib/dhcpcd/dhcpcd-hooks
        sudo tee /mnt/root/usr/lib/dhcpcd/dhcpcd-hooks/30-time-sync << 'EOF'
        #!/bin/sh
        case "$reason" in
        BOUND|INFORM|REBIND|REBOOT)
            logger -t dhcpcd "Syncing system clock via NTP..."
            ntpd -q -n -p pool.ntp.org 2>/dev/null || \
            ntpd -q -n -p time.google.com 2>/dev/null || \
            ntpd -q -n -p time.cloudflare.com 2>/dev/null || \
            logger -t dhcpcd "Time sync failed"
            ;;
        esac
        EOF
        sudo chmod +x /mnt/root/usr/lib/dhcpcd/dhcpcd-hooks/30-time-sync

        sudo tee /mnt/root/etc/network/interfaces << 'EOF'
        auto lo
        iface lo inet loopback

        allow-hotplug eth0
        iface eth0 inet manual

        allow-hotplug eth1
        iface eth1 inet manual

        allow-hotplug wlan0
        iface wlan0 inet manual

        allow-hotplug wlan1
        iface wlan1 inet manual
        EOF

        sudo mkdir -p /mnt/root/etc/wpa_supplicant
        sudo tee /mnt/root/etc/wpa_supplicant/wpa_supplicant.conf << 'EOF'
        ctrl_interface=/var/run/wpa_supplicant
        ctrl_interface_group=0
        update_config=1
        country=GB
        EOF

    - name: Apply Pi-Star OS overlay
      run: |
        echo "Applying Pi-Star OS overlay files..."

        # Copy fstab
        sudo cp overlay/etc/fstab /mnt/root/etc/fstab

        # Copy configuration
        sudo cp overlay/etc/pistar-os.conf /mnt/root/etc/pistar-os.conf

        # Copy scripts
        sudo cp overlay/usr/local/bin/pistar-upgrade /mnt/root/usr/local/bin/
        sudo cp overlay/usr/local/bin/pistar-rollback /mnt/root/usr/local/bin/
        sudo cp overlay/usr/local/bin/pistar-slot-info /mnt/root/usr/local/bin/
        sudo cp overlay/usr/local/bin/pistar-config /mnt/root/usr/local/bin/
        sudo chmod +x /mnt/root/usr/local/bin/pistar-*

        # Copy init scripts
        sudo cp overlay/etc/init.d/pistar-config /mnt/root/etc/init.d/
        sudo cp overlay/etc/init.d/pistar-boot-watchdog /mnt/root/etc/init.d/
        sudo cp overlay/etc/init.d/pistar-health-check /mnt/root/etc/init.d/
        sudo cp overlay/etc/init.d/pistar-data-resize /mnt/root/etc/init.d/
        sudo cp overlay/etc/init.d/pistar-bindmounts /mnt/root/etc/init.d/
        sudo chmod +x /mnt/root/etc/init.d/pistar-*

        # Enable Pi-Star OS services
        sudo ln -s /etc/init.d/pistar-bindmounts /mnt/root/etc/runlevels/boot/pistar-bindmounts
        sudo ln -s /etc/init.d/pistar-config /mnt/root/etc/runlevels/boot/pistar-config
        sudo ln -s /etc/init.d/pistar-boot-watchdog /mnt/root/etc/runlevels/boot/pistar-boot-watchdog
        sudo ln -s /etc/init.d/pistar-health-check /mnt/root/etc/runlevels/default/pistar-health-check
        sudo ln -s /etc/init.d/pistar-data-resize /mnt/root/etc/runlevels/boot/pistar-data-resize

        # Create bind-mount stub directories in rootfs
        sudo mkdir -p /mnt/root/home
        sudo mkdir -p /mnt/root/etc/dropbear
        sudo mkdir -p /mnt/root/etc/wpa_supplicant
        sudo mkdir -p /mnt/root/data

        echo "Overlay applied"

    - name: Configure boot partition with A/B slot support
      run: |
        # Copy boot files from rootfs to boot partition
        if [ -d /mnt/root/boot/firmware ] && [ -n "$(find /mnt/root/boot/firmware -maxdepth 1 -mindepth 1 -print -quit)" ]; then
          sudo cp -a /mnt/root/boot/firmware/* /mnt/boot/
        else
          echo "ERROR: No boot files found in /boot/firmware"
          exit 1
        fi

        # Verify critical boot files
        if [ ! -f /mnt/boot/cmdline.txt ] || [ ! -f /mnt/boot/config.txt ]; then
          echo "ERROR: Critical boot files missing"
          exit 1
        fi

        # Ensure cmdline.txt points to slot A (P2)
        sudo sed -i 's|root=/dev/mmcblk0p[0-9]*|root=/dev/mmcblk0p2|' /mnt/boot/cmdline.txt
        # Ensure fsck.repair=yes is present
        if ! grep -q 'fsck.repair=yes' /mnt/boot/cmdline.txt; then
          sudo sed -i 's/$/ fsck.repair=yes/' /mnt/boot/cmdline.txt
        fi

        echo "cmdline.txt: $(cat /mnt/boot/cmdline.txt)"

        # Write slot.conf
        sudo cp overlay/boot/firmware/slot.conf /mnt/boot/slot.conf
        # Set initial version
        sudo sed -i "s/^SLOT_A_VERSION=.*/SLOT_A_VERSION=\"${VERSION} (${BUILD_DATE})\"/" /mnt/boot/slot.conf

        echo "Boot partition configured with A/B slot support"

    - name: Create sample configuration file
      run: |
        sudo tee /mnt/boot/pistar-config.txt.sample << 'EOF'
        # Pi-Star OS Boot Configuration
        # Copy this file to the boot partition as 'pistar-config.txt'
        # Remove the # from lines you want to use
        # WARNING: This file will be DELETED after processing for security!
        #
        # This file works for FIRST BOOT and RECOVERY:
        #   - First boot: configure WiFi, SSH, etc. on a new install
        #   - Recovery: pop the SD card out, mount on a PC, drop this file
        #     on the boot partition, put card back, reboot

        # === WIFI CONFIGURATION ===
        # Primary network (highest priority)
        #wifi_ssid=YourWorkNetwork
        #wifi_password=YourWorkPassword

        # Secondary networks (numbered for priority - higher numbers = higher priority)
        #wifi_ssid_2=YourHomeNetwork
        #wifi_password_2=YourHomePassword

        #wifi_ssid_3=YourMobileHotspot
        #wifi_password_3=YourHotspotPassword

        # WiFi country code (affects available channels and power limits)
        wifi_country=GB

        # === USER SECURITY ===
        # Set password for pi-star user (required for SSH password auth)
        user_password=raspberry

        # Enable SSH password authentication (default: key-only)
        enable_ssh_password=true

        # Add SSH public key for secure access (recommended)
        #ssh_key=ssh-rsa AAAAB3NzaC1yc2EAAAA... your-email@example.com

        # === SYSTEM CONFIGURATION ===
        hostname=pi-star
        timezone=Europe/London
        locale=en_GB.UTF-8

        # === SECURITY NOTES ===
        # - Root account is disabled by default (secure)
        # - pi-star user has passwordless sudo access
        # - SSH password authentication is disabled unless explicitly enabled
        # - THIS FILE WILL BE DELETED after processing for security
        # - WiFi networks are tried in order of priority (higher numbers first)
        EOF

    - name: Create /data skeleton
      run: |
        echo "Creating /data partition skeleton..."

        # Persistent directories on /data
        sudo mkdir -p /mnt/data/etc/dropbear
        sudo mkdir -p /mnt/data/etc/wpa_supplicant
        sudo mkdir -p /mnt/data/etc/mmdvmhost
        sudo mkdir -p /mnt/data/etc/dmrclients
        sudo mkdir -p /mnt/data/etc/dstarclients
        sudo mkdir -p /mnt/data/etc/ysfclients
        sudo mkdir -p /mnt/data/etc/nxdnclients
        sudo mkdir -p /mnt/data/etc/p25clients
        sudo mkdir -p /mnt/data/etc/fmclients
        sudo mkdir -p /mnt/data/etc/aprsclients
        sudo mkdir -p /mnt/data/etc/pocsagclients
        sudo mkdir -p /mnt/data/etc/dstarrepeater
        sudo mkdir -p /mnt/data/etc/pistar-mcp
        sudo mkdir -p /mnt/data/home/pi-star
        sudo mkdir -p /mnt/data/tmp

        # Copy default SSH host keys if they exist
        if [ -d /mnt/root/etc/dropbear ]; then
          sudo cp /mnt/root/etc/dropbear/* /mnt/data/etc/dropbear/ 2>/dev/null || true
        fi

        # Copy default wpa_supplicant config
        if [ -f /mnt/root/etc/wpa_supplicant/wpa_supplicant.conf ]; then
          sudo cp /mnt/root/etc/wpa_supplicant/wpa_supplicant.conf /mnt/data/etc/wpa_supplicant/
        fi

        # Set ownership for pi-star home (look up UID/GID from rootfs)
        PISTAR_UID=$(grep '^pi-star:' /mnt/root/etc/passwd | cut -d: -f3)
        PISTAR_GID=$(grep '^pi-star:' /mnt/root/etc/passwd | cut -d: -f4)
        sudo chown "${PISTAR_UID}:${PISTAR_GID}" /mnt/data/home/pi-star

        echo "/data skeleton created:"
        find /mnt/data -type d | sort

    - name: Create system information file
      run: |
        sudo tee /mnt/root/etc/pistar-os-release << EOF
        Pi-Star OS
        Build Date: ${BUILD_DATE}
        Version: ${VERSION}
        Alpine Version: ${ALPINE_VERSION}
        Architecture: ${ALPINE_ARCH}
        Base: RasPINE (Alpine Linux + Raspberry Pi kernel)
        EOF

    - name: Create rootfs tarball from slot A
      run: |
        echo "Creating rootfs tarball from slot A..."

        # Rootfs already has kernel files in /boot/firmware/ from apk install
        cd /mnt/root
        sudo tar -cJf "/tmp/Pi-Star_OS-${BUILD_DATE}.rootfs.tar.xz" .
        sudo chown "$(id -u):$(id -g)" "/tmp/Pi-Star_OS-${BUILD_DATE}.rootfs.tar.xz"
        cd /

        # Generate checksum
        cd /tmp
        sha256sum "Pi-Star_OS-${BUILD_DATE}.rootfs.tar.xz" > "Pi-Star_OS-${BUILD_DATE}.rootfs.tar.xz.sha256"

        echo "Rootfs tarball created:"
        ls -lh "/tmp/Pi-Star_OS-${BUILD_DATE}.rootfs.tar.xz"

    - name: Create manifest
      run: |
        cat > /tmp/manifest.txt << EOF
        VERSION=${VERSION}
        BUILD_DATE=${BUILD_DATE}
        ALPINE_VERSION=${ALPINE_VERSION}
        ROOTFS_FILENAME=Pi-Star_OS-${BUILD_DATE}.rootfs.tar.xz
        EOF

    - name: Cleanup and unmount
      run: |
        sudo rm -f /mnt/root/usr/bin/qemu-arm-static
        sync
        sudo umount /mnt/data
        sudo umount /mnt/boot
        sudo umount /mnt/root
        sudo losetup -d /dev/loop0

    - name: Compress image
      run: |
        echo "Compressing image..."
        xz -9 -T0 pistar-os.img
        mv pistar-os.img.xz "Pi-Star_OS-${BUILD_DATE}.img.xz"

        sha256sum "Pi-Star_OS-${BUILD_DATE}.img.xz" > "Pi-Star_OS-${BUILD_DATE}.img.xz.sha256"

        echo "Image compressed:"
        ls -lh "Pi-Star_OS-${BUILD_DATE}.img.xz"

    - name: Collect artifacts
      run: |
        mkdir -p artifacts
        mv "Pi-Star_OS-${BUILD_DATE}.img.xz" artifacts/
        mv "Pi-Star_OS-${BUILD_DATE}.img.xz.sha256" artifacts/
        mv "/tmp/Pi-Star_OS-${BUILD_DATE}.rootfs.tar.xz" artifacts/
        mv "/tmp/Pi-Star_OS-${BUILD_DATE}.rootfs.tar.xz.sha256" artifacts/
        mv /tmp/manifest.txt artifacts/

        echo "Artifacts:"
        ls -lh artifacts/

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: Pi-Star_OS-${{ env.BUILD_DATE }}
        path: artifacts/
        retention-days: 90

    - name: Create Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ env.BUILD_DATE }}
        name: Pi-Star OS ${{ env.BUILD_DATE }}
        draft: false
        prerelease: false
        files: |
          artifacts/Pi-Star_OS-*.img.xz
          artifacts/Pi-Star_OS-*.img.xz.sha256
          artifacts/Pi-Star_OS-*.rootfs.tar.xz
          artifacts/Pi-Star_OS-*.rootfs.tar.xz.sha256
          artifacts/manifest.txt
        body: |
          # Pi-Star OS - ${{ env.BUILD_DATE }}

          Raspberry Pi OS kernel/firmware with Alpine Linux ${{ env.ALPINE_VERSION }} userland.
          A/B root partition scheme for safe, router-style upgrades.

          ## Downloads
          - **Full image** (first install): `Pi-Star_OS-${{ env.BUILD_DATE }}.img.xz`
          - **Rootfs tarball** (upgrades): `Pi-Star_OS-${{ env.BUILD_DATE }}.rootfs.tar.xz`

          ## Verification
          ```
          sha256sum -c Pi-Star_OS-${{ env.BUILD_DATE }}.img.xz.sha256
          ```

          ## Default Credentials
          - Username: `pi-star`
          - Password: `raspberry`
          - SSH: Enabled (key-only by default)

          ## Upgrade from existing Pi-Star OS
          ```
          sudo pistar-upgrade --install
          ```
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
